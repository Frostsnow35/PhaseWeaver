[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phaseweaver"
version = "0.1.0"
description = "Phase-aware agent runtime for GPU resource coordination"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/phaseweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 不使用 pytest 的 tmp_path:%TEMP% 与 \\?\ 长路径在本机 sandbox 下不可访问,
# 测试改为在 runs/ 下自建临时文件(见 tests/unit/test_journal.py)。
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/phaseweaver"]
