[project]
name = "phaseweaver-plugin-example"
version = "0.1.0"
description = "Example third-party backend for PhaseWeaver (entry point demo)"
requires-python = ">=3.11"
dependencies = ["phaseweaver"]

[project.entry-points."phaseweaver.backends"]
example-device = "phaseweaver_plugin_example:build_backend"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phaseweaver_plugin_example"]
