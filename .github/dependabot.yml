version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "ruff"
          - "mypy"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # 大版本升级由人评估:它们常常改变 runner 要求或输入语义,不适合自动合并。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
