name: Bug report
description: 报告一个可复现的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认问题不是「本机 sandbox 限制」导致的,相关约束见 README「本机环境注意事项」。
  - type: textarea
    id: what
    attributes:
      label: 现象
      description: 发生了什么?期望是什么?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 命令、工作负载文件、seed、容量
      placeholder: |
        uv run python -m phaseweaver.demo compare --workload examples/workloads/w3-queue.toml --capacity-gib 2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 事件
      description: 相关 journal 事件(seq + event 名即可),不要粘贴整份日志
  - type: input
    id: version
    attributes:
      label: 版本
      description: 提交哈希
