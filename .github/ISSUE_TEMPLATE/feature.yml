name: Feature / experiment proposal
description: 提出一个新能力或一组新实验
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 不要直接描述方案,先说问题与判据
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: 完成判据
      description: 什么样的数字/行为变化算成功?失败时如何判定?
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: 影响层
      options:
        - 运行时核心(units/leases/runtime)
        - 调度(policy/scheduler)
        - 仿真(backends/mock)
        - 工具执行(tools)
        - 指标与实验(metrics/demo)
        - 文档与规范
    validations:
      required: true
  - type: checkboxes
    id: adr
    attributes:
      label: 是否需要 ADR
      options:
        - label: 这个改动会引入或推翻既有设计取舍(在 PR 描述中说明,记录不入库)
